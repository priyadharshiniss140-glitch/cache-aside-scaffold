name: Temporary cache verification and load benchmark

on:
  push:
    branches: [feat/cache-aside-redis]

jobs:
  cache-and-load-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      SLOW_MS: 40
    steps:
      - name: Checkout branch and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Benchmark uncached baseline from main
        shell: bash
        run: |
          git fetch origin main
          git worktree add /tmp/cache-aside-baseline origin/main
          cd /tmp/cache-aside-baseline
          npm install
          npm run db:push
          SEED_OUTPUT="$(npm run seed)"
          printf '%s\n' "$SEED_OUTPUT"
          AUTHOR_ID="$(printf '%s\n' "$SEED_OUTPUT" | sed -n 's/^A user id to test GET \/users\/:id -> //p' | tail -n 1)"
          test -n "$AUTHOR_ID"
          PORT=3001 SLOW_MS=40 REDIS_URL="$REDIS_URL" node src/server.js > /tmp/cache-before.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3001/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3001/health
          echo "BENCHMARK BEFORE: GET /posts/feed (uncached baseline)"
          API=http://localhost:3001 node scripts/load.js /posts/feed 50 2000
          echo "BENCHMARK BEFORE: GET /users/$AUTHOR_ID (uncached baseline)"
          API=http://localhost:3001 node scripts/load.js "/users/$AUTHOR_ID" 50 2000
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Verify invalidation and benchmark cached endpoints
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install
          npm run db:push
          SEED_OUTPUT="$(npm run seed)"
          printf '%s\n' "$SEED_OUTPUT"
          AUTHOR_ID="$(printf '%s\n' "$SEED_OUTPUT" | sed -n 's/^A user id to test GET \/users\/:id -> //p' | tail -n 1)"
          test -n "$AUTHOR_ID"
          PORT=3000 SLOW_MS=40 REDIS_URL="$REDIS_URL" node src/server.js > /tmp/cache-after.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          HEALTHY=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health >/dev/null; then HEALTHY=true; break; fi
            sleep 1
          done
          if [ "$HEALTHY" != true ]; then
            echo "Cached server failed to start; server log follows:"
            cat /tmp/cache-after.log
            exit 1
          fi
          curl --fail --silent http://localhost:3000/health
          AUTHOR_ID="$AUTHOR_ID" API=http://localhost:3000 npm run verify
          BEFORE_NAME="$(curl --fail --silent "http://localhost:3000/users/$AUTHOR_ID" | node --input-type=module -e 'let s=""; for await (const c of process.stdin) s += c; process.stdout.write(JSON.parse(s).name)')"
          curl --fail --silent -X PUT "http://localhost:3000/users/$AUTHOR_ID" -H "content-type: application/json" -d '{"name":"Cache Invalidation Check"}' >/dev/null
          AFTER_NAME="$(curl --fail --silent "http://localhost:3000/users/$AUTHOR_ID" | node --input-type=module -e 'let s=""; for await (const c of process.stdin) s += c; process.stdout.write(JSON.parse(s).name)')"
          test "$AFTER_NAME" = "Cache Invalidation Check"
          echo "PASS: profile cache invalidated after PUT /users/$AUTHOR_ID (before=$BEFORE_NAME, after=$AFTER_NAME)"
          curl --fail --silent "http://localhost:3000/posts/feed?page=1&sort=new" >/dev/null
          curl --fail --silent "http://localhost:3000/users/$AUTHOR_ID" >/dev/null
          echo "BENCHMARK AFTER: GET /posts/feed (warm cache)"
          API=http://localhost:3000 node scripts/load.js /posts/feed 50 2000
          echo "BENCHMARK AFTER: GET /users/$AUTHOR_ID (warm cache)"
          API=http://localhost:3000 node scripts/load.js "/users/$AUTHOR_ID" 50 2000
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
